.sl-root{
  --bg:#F4F1EA; --card:#FFFDF8; --sage:#6F8F72; --sage-deep:#5A7A5E; --sage-light:#EBF0EA;
  --text:#4A4A44; --text-sub:#8A867C; --border:#D9D3C7; --line:#EEEAE1;
  --notice-bg:#F6E6DC; --notice-text:#8A5638;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  font-weight:400; font-size:15px;
  background:var(--bg); color:var(--text);
  max-width:430px; margin:0 auto; height:100vh; height:100dvh; overflow:hidden;
  display:flex; flex-direction:column; position:relative;
  -webkit-font-smoothing:antialiased;
}
.sl-root *{box-sizing:border-box;}
.sl-body{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 0 calc(104px + env(safe-area-inset-bottom));}
.sl-head{padding:28px 24px 18px;}
.sl-h1{font-size:20px; font-weight:500; margin:0;}
.sl-sub{font-size:13px; color:var(--text-sub); margin:8px 0 0; line-height:1.9;}

.sl-secLabel{font-size:13px; color:var(--sage-deep); font-weight:500; padding:30px 24px 10px;}

.sl-list{background:var(--card); border:1px solid var(--border); border-radius:16px; margin:0 16px; overflow:hidden;}
.sl-item{
  display:flex; align-items:center; gap:14px; width:100%;
  padding:0 20px; min-height:68px; background:none; border:0;
  border-bottom:1px solid var(--line); text-align:left; cursor:pointer;
  font:inherit; color:inherit; -webkit-tap-highlight-color:transparent;
}
.sl-item:last-child{border-bottom:0;}
.sl-item:active{background:var(--sage-light);}
.sl-item:focus-visible{outline:2px solid var(--sage-deep); outline-offset:-2px;}
.sl-name{flex:1; font-size:16px;}
.sl-cat{display:block; font-size:12px; color:var(--text-sub); margin-top:3px;}
.sl-dot{
  width:26px; height:26px; border-radius:50%; flex:none;
  border:1.5px solid var(--border); background:var(--sage-light);
  transition:background .18s ease, transform .18s ease, border-color .18s ease;
}
.sl-item.hit .sl-dot{background:var(--sage); border-color:var(--sage); transform:scale(1.18);}

.sl-addWrap{background:var(--card); border:1px solid var(--border); border-radius:16px; margin:14px 16px 0; padding:16px 18px 18px;}
.sl-secLabel + .sl-addWrap{margin-top:0;}
.sl-addRow{display:flex; gap:8px;}
.sl-help{font-size:12px; color:var(--text-sub); line-height:1.95; margin:12px 0 0;}
.sl-helpIn{background:var(--card); padding:14px 20px 16px; font-size:12px; color:var(--text-sub); line-height:1.95; margin:0;}

.sl-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.sl-chip{display:flex; align-items:center; gap:2px; background:var(--sage-light); border-radius:999px; padding:4px 4px 4px 13px;}
.sl-chipName{background:none; border:0; font:inherit; font-size:13px; color:var(--sage-deep); cursor:pointer; padding:2px 0;}
.sl-chipX{background:none; border:0; font:inherit; font-size:13px; color:var(--text-sub); cursor:pointer; padding:2px 8px; line-height:1;}
.sl-chipEdit{font:inherit; font-size:16px; color:var(--text); background:var(--card); border:1px solid var(--sage-deep); border-radius:999px; padding:3px 11px; width:112px;}
.sl-chipNone{font-size:12px; color:var(--text-sub); margin-top:14px;}

.sl-toast{
  position:absolute; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--sage-deep); color:var(--card); border-radius:16px;
  padding:13px 10px 13px 18px; display:flex; align-items:center; gap:8px;
  font-size:14px; z-index:10;
}
.sl-toastMsg{flex:1; font-weight:500;}
.sl-toastBtn{background:rgba(255,253,248,.2); border:0; color:var(--card); font:inherit; font-size:14px; font-weight:500; padding:8px 14px; border-radius:12px; cursor:pointer;}
.sl-toastX{background:none; border:0; color:rgba(255,253,248,.8); font:inherit; font-size:16px; padding:6px 9px; cursor:pointer; line-height:1;}

.sl-tabs{position:absolute; left:0; right:0; bottom:0; display:flex; padding-bottom:env(safe-area-inset-bottom); background:var(--card); border-top:1px solid var(--border); z-index:11;}
.sl-tab{flex:1; padding:12px 0 18px; background:none; border:0; cursor:pointer; font:inherit; font-size:12px; color:var(--text-sub); -webkit-tap-highlight-color:transparent;}
.sl-tab[aria-current="page"]{color:var(--sage-deep); font-weight:500;}
.sl-tabMark{display:block; width:20px; height:2px; margin:0 auto 8px; background:transparent; border-radius:2px;}
.sl-tab[aria-current="page"] .sl-tabMark{background:var(--sage-deep);}

.sl-sheetWrap{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; z-index:20;}
.sl-scrim{position:absolute; inset:0; background:rgba(74,74,68,.32);}
.sl-sheet{position:relative; background:var(--card); border-top:1px solid var(--border); border-radius:16px 16px 0 0; padding:20px 22px calc(28px + env(safe-area-inset-bottom)); max-height:90%; overflow-y:auto;}
.sl-sheetTop{display:flex; align-items:center; gap:10px;}
.sl-sheetTitle{font-size:18px; font-weight:500; margin:0;}
.sl-badge{font-size:12px; color:var(--sage-deep); background:var(--sage-light); border-radius:999px; padding:3px 10px;}
.sl-x{margin-left:auto; background:none; border:0; font:inherit; font-size:18px; color:var(--text-sub); cursor:pointer; padding:4px 6px; line-height:1;}
.sl-lead{font-size:13px; line-height:2; margin:18px 0 0; background:var(--sage-light); border-radius:12px; padding:14px 16px;}
.sl-field{margin-top:24px;}
.sl-lab{display:block; font-size:14px; font-weight:500; margin-bottom:8px;}
.sl-input,.sl-area{
  width:100%; font:inherit; font-size:16px; color:var(--text);
  border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--card);
}
.sl-area{min-height:96px; resize:vertical; line-height:1.8;}
.sl-input[type="date"]{-webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%; min-height:50px; line-height:1.5;}
.sl-input[type="date"]::-webkit-date-and-time-value{text-align:left;}
.sl-input:focus,.sl-area:focus{outline:2px solid var(--sage-deep); outline-offset:-1px; border-color:var(--sage-deep);}
.sl-input::placeholder,.sl-area::placeholder{color:var(--text-sub);}
.sl-row{display:flex; gap:10px; margin-top:28px; align-items:stretch;}
.sl-btn{flex:1; font:inherit; font-size:15px; padding:13px; border-radius:16px; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text);}
.sl-btn.pri{background:var(--sage); border-color:var(--sage); color:var(--card); font-size:19px; font-weight:500; padding:11px 13px;}
.sl-btn.pri:disabled{background:var(--sage-light); border-color:var(--sage-light); color:var(--text-sub); cursor:default;}
.sl-btn.warn{background:var(--notice-bg); border-color:var(--notice-bg); color:var(--notice-text);}
.sl-btn:focus-visible{outline:2px solid var(--sage-deep); outline-offset:2px;}

.sl-confirmWrap{position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:28px;}
.sl-confirm{position:relative; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px 22px 20px; width:100%; max-width:330px;}
.sl-confirmMsg{font-size:16px; font-weight:500; line-height:1.7; margin:0;}
.sl-confirmSub{font-size:13px; color:var(--text-sub); line-height:1.9; margin:10px 0 0;}

.sl-cal{background:var(--card); border:1px solid var(--border); border-radius:16px; margin:0 16px; padding:8px 8px 14px;}
.sl-calNav{display:flex; align-items:center; justify-content:space-between; padding:8px 10px 10px;}
.sl-calMonth{font-size:16px; font-weight:500;}
.sl-navBtn{border:0; background:none; font:inherit; font-size:20px; color:var(--sage-deep); cursor:pointer; padding:4px 12px; border-radius:12px;}
.sl-navBtn:disabled{color:var(--border); cursor:default;}
.sl-grid{display:grid; grid-template-columns:repeat(7,1fr);}
.sl-dow{text-align:center; font-size:12px; color:var(--text-sub); padding:4px 0 8px;}
.sl-day{aspect-ratio:1/1; border:0; background:none; font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border-radius:12px; -webkit-tap-highlight-color:transparent; padding:0;}
.sl-dayNum{font-size:14px; color:var(--text);}
.sl-day.out .sl-dayNum{color:var(--border);}
.sl-day.sel{background:var(--sage-light);}
.sl-day.today .sl-dayNum{font-weight:500; color:var(--sage-deep); text-decoration:underline; text-underline-offset:4px;}
.sl-pips{display:flex; gap:3px; height:6px; align-items:center;}
.sl-pip{width:6px; height:6px; border-radius:50%; background:var(--sage);}
.sl-pipMore{font-size:9px; color:var(--text-sub); line-height:1;}

.sl-note{font-size:12px; color:var(--text-sub); line-height:1.95; padding:14px 24px;}
.sl-rec{display:block; width:calc(100% - 32px); margin:0 16px 8px; text-align:left; font:inherit; color:inherit; cursor:pointer; padding:15px 18px; border:1px solid var(--border); border-radius:12px; background:var(--card);}
.sl-rec:active{background:var(--sage-light);}
.sl-recTop{display:flex; align-items:baseline; gap:8px;}
.sl-recName{font-size:16px;}
.sl-recMeta{font-size:12px; color:var(--text-sub); margin-left:auto;}
.sl-recNote{display:block; font-size:14px; color:var(--text-sub); margin-top:6px; line-height:1.8; white-space:pre-wrap;}

.sl-table{width:calc(100% - 32px); margin:0 16px; border-collapse:separate; border-spacing:0; background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; font-size:14px;}
.sl-table th{text-align:left; font-weight:500; font-size:12px; color:var(--sage-deep); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--sage-light);}
.sl-table td{padding:12px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.8;}
.sl-table tr:last-child td{border-bottom:0;}
.sl-table td:first-child{white-space:nowrap; color:var(--text-sub); font-size:13px;}
.sl-back{font-size:12px; color:var(--text-sub);}

.sl-seg{display:flex; gap:8px; padding:0 16px; flex-wrap:wrap;}
.sl-segBtn{font:inherit; font-size:13px; padding:8px 15px; border-radius:999px; cursor:pointer; border:1px solid var(--sage-light); background:var(--sage-light); color:var(--text);}
.sl-segBtn[aria-pressed="true"]{background:var(--sage-deep); border-color:var(--sage-deep); color:var(--card); font-weight:500;}

.sl-card{background:var(--card); border:1px solid var(--border); border-radius:16px; margin:0 16px; padding:18px 20px;}
.sl-opt{display:flex; gap:12px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.sl-opt:first-child{padding-top:0;} .sl-opt:last-child{border-bottom:0; padding-bottom:0;}
.sl-radio{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border); background:var(--sage-light); flex:none; margin-top:2px; display:flex; align-items:center; justify-content:center;}
.sl-radio i{width:10px; height:10px; border-radius:50%; background:var(--sage); display:none;}
.sl-opt.on .sl-radio{border-color:var(--sage); background:var(--card);} .sl-opt.on .sl-radio i{display:block;}
.sl-optName{font-size:15px; font-weight:500;} .sl-optDesc{display:block; font-size:12px; color:var(--text-sub); margin-top:5px; line-height:1.9;}

.sl-empty{padding:36px 28px; text-align:center; color:var(--text-sub); font-size:14px; line-height:2;}
.sl-link{background:none; border:0; font:inherit; font-size:13px; color:var(--sage-deep); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px;}
.sl-manage{display:flex; align-items:center; gap:8px; padding:14px 18px 15px; border-bottom:1px solid var(--line); flex-wrap:wrap; background:var(--card);}
.sl-manageName{flex-basis:100%; display:flex; align-items:center; gap:8px;}
.sl-nameBtn{background:none; border:0; font:inherit; font-size:16px; color:inherit; cursor:pointer; padding:2px 0; text-align:left;
  text-decoration:underline dotted var(--border); text-underline-offset:6px;}
.sl-nameEdit{flex:1; font:inherit; font-size:16px; color:var(--text); background:var(--card); border:1px solid var(--sage-deep); border-radius:12px; padding:7px 12px;}
.sl-count{font-size:12px; color:var(--text-sub); margin-left:auto; flex:none;}
.sl-miniBtn{flex:none; font:inherit; font-size:13px; padding:7px 12px; border-radius:12px; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text);}
.sl-miniBtn.warn{background:var(--notice-bg); border-color:var(--notice-bg); color:var(--notice-text);}
.sl-move{display:flex; gap:4px; flex:none;}
.sl-moveBtn{width:34px; height:34px; border:1px solid var(--border); background:var(--card); border-radius:12px; font:inherit; font-size:14px; color:var(--sage-deep); cursor:pointer; line-height:1;}
.sl-moveBtn:disabled{color:var(--border); cursor:default;}
.sl-notice{margin:16px 16px 0; background:var(--notice-bg); color:var(--notice-text); border-radius:12px; padding:12px 16px; font-size:13px; line-height:1.9;}
.sl-pick{display:flex; gap:8px; padding:0 16px; flex-wrap:wrap;}
.sl-range{display:flex; align-items:center; gap:8px; padding:12px 16px 0; font-size:13px; color:var(--text-sub);}
.sl-range .sl-input{flex:1;}
.sl-printTitle{display:none;}
@media (prefers-reduced-motion:reduce){ .sl-dot{transition:none;} }
@media print{
  .sl-root{height:auto !important; overflow:visible !important; max-width:none !important; background:none !important;}
  .sl-body{overflow:visible !important; padding:0 !important;}
  .sl-tabs,.sl-toast,.sl-noPrint{display:none !important;}
  .sl-printTitle{display:block; font-size:16pt; font-weight:500; margin:0 0 10pt;}
  .sl-card,.sl-table{margin:0 0 10pt !important; width:100% !important; border-radius:0 !important; background:none !important;}
  .sl-table{font-size:10.5pt;} .sl-table th{background:none !important;}
  .sl-table tr{break-inside:avoid;}
}
